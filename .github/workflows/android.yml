# The Android app (android/): built on every change to it; a tag app-vX.Y.Z builds it signed (the
# key from the repository's secrets: android/README.md) and puts the APK in a GitHub release.
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
    tags: ['app-v*']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write         # (the release, on a tag)

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/app-v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4      # (also checks the wrapper's jar against Gradle's sums)

      - name: The Android SDK parts AGP 9.5.1 asks for
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: The signing key (a release only)
        if: env.RELEASE == 'true'
        env:
          KEYSTORE: ${{ secrets.TANGAV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::the secret TANGAV_KEYSTORE_BASE64 is not set (android/README.md: releases)"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TANGAV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          TANGAV_STORE_PASSWORD: ${{ secrets.TANGAV_STORE_PASSWORD }}
          TANGAV_KEY_ALIAS: ${{ secrets.TANGAV_KEY_ALIAS }}
          TANGAV_KEY_PASSWORD: ${{ secrets.TANGAV_KEY_PASSWORD }}
          TANGAV_VERSION: ${{ env.RELEASE == 'true' && github.ref_name || '' }}
          TANGAV_BUILD: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      - name: The signature, checked
        if: env.RELEASE == 'true'
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          cp "$apk" "tang-av-scaler-${GITHUB_REF_NAME#app-v}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: tang-av-scaler-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: The release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#app-v}"
          gh release create "$GITHUB_REF_NAME" "tang-av-scaler-$v.apk" \
            --title "Tang AV Scaler app $v" \
            --notes "The board's Android app ($v): every setting, the status, a capture, the board's maintenance; over Wi-Fi or Bluetooth. Install: download the APK on the phone and open it (Android asks to allow installs from the browser once). Android 10 or later. Signing certificate SHA-256: 2ece5e4f0af86d15719d0fc2fcb70736f52004c0001c97776f862ce1a3f27cd9"
